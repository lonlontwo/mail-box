<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密碼同步工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .status {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 16px;
        }

        .loading {
            background: #d1ecf1;
            color: #0c5460;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.9;
        }

        code {
            background: #f4f4f4;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 密碼同步工具</h1>
        <p>此工具會從 Firebase 載入密碼並同步到瀏覽器</p>
        <div id="status" class="status loading">⏳ 正在連接 Firebase...</div>
        <button id="syncBtn" onclick="syncPassword()" style="display:none">🔄 重新同步</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let db;

        // 初始化 Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log('Firebase 初始化成功');
            syncPassword();
        } catch (error) {
            showStatus('❌ Firebase 初始化失敗: ' + error.message, 'error');
        }

        async function syncPassword() {
            const statusDiv = document.getElementById('status');
            const syncBtn = document.getElementById('syncBtn');

            statusDiv.className = 'status loading';
            statusDiv.innerHTML = '⏳ 正在從 Firebase 載入密碼...';
            syncBtn.style.display = 'none';

            try {
                const doc = await db.collection('settings').doc('config').get();

                if (doc.exists) {
                    const data = doc.data();
                    const adminPwd = data.adminPassword || 'csmcsm46';
                    const frontendPwd = data.frontendPassword || 'csmcsm46';

                    // 寫入 localStorage
                    localStorage.setItem('admin_password', adminPwd);
                    localStorage.setItem('frontend_password', frontendPwd);

                    showStatus(
                        '✅ <strong>密碼同步成功！</strong><br><br>' +
                        '後台密碼：<code>' + adminPwd + '</code><br>' +
                        '前台密碼：<code>' + frontendPwd + '</code><br><br>' +
                        '現在可以前往登入頁面使用新密碼了！<br><br>' +
                        '<a href="ux/" style="color: #667eea; text-decoration: none; font-weight: bold;">→ 前往後台登入</a><br>' +
                        '<a href="ui/" style="color: #667eea; text-decoration: none; font-weight: bold;">→ 前往前台登入</a>',
                        'success'
                    );
                    syncBtn.style.display = 'inline-block';
                } else {
                    showStatus(
                        '⚠️ Firebase 中沒有密碼設定<br><br>' +
                        '將使用預設密碼：<code>csmcsm46</code><br><br>' +
                        '已同步到瀏覽器',
                        'error'
                    );
                    localStorage.setItem('admin_password', 'csmcsm46');
                    localStorage.setItem('frontend_password', 'csmcsm46');
                    syncBtn.style.display = 'inline-block';
                }
            } catch (error) {
                showStatus('❌ 同步失敗: ' + error.message, 'error');
                syncBtn.style.display = 'inline-block';
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status ' + type;
            statusDiv.innerHTML = message;
        }
    </script>
</body>

</html>
