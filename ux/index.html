<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 | Mail Box Manager</title>
    <meta name="description" content="信箱記錄本管理後台 - 新增、編輯、刪除信箱記錄">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
        // 🔒 防止 iframe 內部使用右鍵和 F12
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || (e.ctrlKey && e.keyCode == 85)) return false;
        }
    </script>
</head>

<body>
    <!-- 登入遮罩 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">🔐</div>
                <h2>管理後台</h2>
                <p>請輸入管理員密碼</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="請輸入密碼" autocomplete="off" required>
                    <button type="submit" class="login-btn">
                        <span>🔓</span>
                        <span>登入</span>
                    </button>
                </div>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container" id="mainContainer" style="display: none;">
        <!-- 頂部導航 -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">⚙️</div>
                    <div class="logo-text">
                        <h1>管理後台</h1>
                        <p class="subtitle">Mail Box Manager Admin</p>
                    </div>
                </div>
                <div class="header-actions">
                    <a href="../ui/" class="btn-secondary">
                        <span>👁️</span>
                        <span>前台查看</span>
                    </a>
                    <button class="btn-danger" id="logoutBtn">
                        <span>🚪</span>
                        <span>登出</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 操作區 -->
        <section class="action-section">
            <button class="btn-primary btn-large" id="addMailboxBtn">
                <span>➕</span>
                <span>新增信箱</span>
            </button>
            <button class="btn-secondary btn-large" id="settingsBtn">
                <span>🔐</span>
                <span>密碼設定</span>
            </button>
        </section>

        <!-- 統計資訊 -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-icon">📧</div>
                <div class="stat-info">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">總信箱數</div>
                </div>
            </div>
        </section>

        <!-- 信箱列表 -->
        <section class="mailbox-section">
            <div class="section-header">
                <h2>信箱列表</h2>
                <div class="search-box-inline">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋信箱..." autocomplete="off">
                </div>
            </div>

            <div class="table-container">
                <table class="mailbox-table" id="mailboxTable">
                    <thead>
                        <tr>
                            <th width="5%">#</th>
                            <th width="30%">信箱</th>
                            <th width="20%">登記時間</th>
                            <th width="30%">備註</th>
                            <th width="15%">操作</th>
                        </tr>
                    </thead>
                    <tbody id="mailboxTableBody">
                        <!-- 資料將由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 空狀態 -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>尚無信箱記錄</h3>
                <p>點擊上方「新增信箱」按鈕來新增第一筆記錄</p>
            </div>
        </section>
    </div>

    <!-- 新增/編輯信箱彈窗 -->
    <div id="mailboxModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeModal" aria-label="關閉">✕</button>
            <div class="modal-header">
                <h3 id="modalTitle">新增信箱</h3>
            </div>
            <form id="mailboxForm" class="modal-form">
                <input type="hidden" id="editId">

                <div class="form-group">
                    <label for="emailInput">信箱地址 <span class="required">*</span></label>
                    <input type="email" id="emailInput" placeholder="請輸入信箱地址" required>
                </div>

                <div class="form-group">
                    <label for="noteInput">備註</label>
                    <textarea id="noteInput" placeholder="選填,記錄此信箱的用途或相關資訊" rows="4"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">取消</button>
                    <button type="submit" class="btn-primary">
                        <span id="submitBtnText">新增</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 密碼設定彈窗 -->
    <div id="settingsModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeSettingsModal" aria-label="關閉">✕</button>
            <div class="modal-header">
                <h3>密碼設定</h3>
                <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.5rem;">
                    修改前台和後台的登入密碼
                </p>
            </div>
            <form id="settingsForm" class="modal-form">
                <div class="form-group">
                    <label for="frontendPasswordInput">
                        前台密碼 (UI)
                        <span style="color: var(--text-tertiary); font-weight: normal; font-size: 0.875rem;">
                            - 用於查看信箱列表
                        </span>
                    </label>
                    <input type="text" id="frontendPasswordInput" placeholder="請輸入前台密碼" required>
                </div>

                <div class="form-group">
                    <label for="backendPasswordInput">
                        後台密碼 (Admin)
                        <span style="color: var(--text-tertiary); font-weight: normal; font-size: 0.875rem;">
                            - 用於管理信箱記錄
                        </span>
                    </label>
                    <input type="text" id="backendPasswordInput" placeholder="請輸入後台密碼" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelSettingsBtn">取消</button>
                    <button type="submit" class="btn-primary">
                        <span>💾 儲存設定</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast"></div>

    <script src="js/admin.js"></script>
</body>

</html>
