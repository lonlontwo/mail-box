<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信箱記錄本 | Mail Box Manager</title>
    <meta name="description" content="雲端信箱記錄管理系統 - 快速查詢您的所有信箱帳號資訊">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- 登入遮罩 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-container">
            <div class="login-header">
                <div class="login-icon">🔒</div>
                <h2>信箱記錄本</h2>
                <p>請輸入密碼以查看記錄</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <input type="password" id="passwordInput" placeholder="請輸入密碼" autocomplete="off" required>
                    <button type="submit" class="login-btn">
                        <span>🔓</span>
                        <span>解鎖</span>
                    </button>
                </div>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- 背景裝飾 -->
    <div class="background-decoration">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 頂部標題區 -->
        <header class="header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">📬</div>
                    <div class="logo-text">
                        <h1>Mail Box Manager</h1>
                        <p class="subtitle">雲端信箱記錄本</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="切換主題">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <a href="../ux/" class="admin-link">
                        <span class="admin-icon">⚙️</span>
                        <span>管理後台</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- 搜尋與篩選區 -->
        <section class="search-section">
            <div class="search-container">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋信箱地址..." autocomplete="off">
                    <button class="clear-search" id="clearSearch" aria-label="清除搜尋">✕</button>
                </div>

                <div class="filter-section">
                    <div class="sort-group">
                        <label for="sortBy">排序:</label>
                        <select id="sortBy" class="filter-select">
                            <option value="date-desc">最新優先</option>
                            <option value="date-asc">最舊優先</option>
                            <option value="email-asc">信箱 A-Z</option>
                            <option value="email-desc">信箱 Z-A</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- 統計資訊 -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-icon">📧</div>
                <div class="stat-info">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">總信箱數</div>
                </div>
            </div>
        </section>

        <!-- 信箱列表 -->
        <section class="mailbox-section">
            <div class="section-header">
                <h2>信箱列表</h2>
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid" aria-label="網格檢視">
                        <span>⊞</span>
                    </button>
                    <button class="view-btn" data-view="list" aria-label="列表檢視">
                        <span>☰</span>
                    </button>
                </div>
            </div>

            <div id="mailboxList" class="mailbox-grid">
                <!-- 信箱卡片將由 JavaScript 動態生成 -->
            </div>

            <!-- 空狀態 -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>尚無信箱記錄</h3>
                <p>請前往管理後台新增您的第一筆信箱記錄</p>
                <a href="../ux/" class="btn-primary">前往管理後台</a>
            </div>

            <!-- 無搜尋結果 -->
            <div id="noResults" class="empty-state" style="display: none;">
                <div class="empty-icon">🔍</div>
                <h3>找不到符合的結果</h3>
                <p>請嘗試其他搜尋關鍵字或篩選條件</p>
            </div>
        </section>
    </div>

    <!-- 信箱詳情彈窗 -->
    <div id="detailModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="closeModal" aria-label="關閉">✕</button>
            <div id="modalBody">
                <!-- 詳細資訊將由 JavaScript 動態生成 -->
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
</body>

</html>
