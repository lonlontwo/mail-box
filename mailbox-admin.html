<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信箱管理後台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 載入動畫 */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-icon {
            font-size: 4rem;
            animation: spin 2s linear infinite;
        }

        .loading-text {
            color: white;
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: 500;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- 載入動畫 -->
    <div class="loading" id="loading">
        <div class="loading-icon">⚙️</div>
        <div class="loading-text">載入管理後台...</div>
    </div>

    <!-- 嵌入後台 -->
    <iframe src="https://11d7f49c.mail-box-6xa.pages.dev/ux/" id="adminFrame" allow="clipboard-write" loading="eager">
    </iframe>

    <script>
        // iframe 載入完成後隱藏載入動畫
        const iframe = document.getElementById('adminFrame');
        const loading = document.getElementById('loading');

        iframe.addEventListener('load', () => {
            setTimeout(() => {
                loading.classList.add('hidden');
            }, 500);
        });

        // 如果 5 秒後還沒載入完成,也隱藏載入動畫
        setTimeout(() => {
            loading.classList.add('hidden');
        }, 5000);
    </script>
</body>

</html>
